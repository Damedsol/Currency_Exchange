# Project: currencyExchange
# Automatically generated by the Initializer subagent
# Last updated: 2026-08-17 (security audit + dependabot sessions)

stack_tecnologico:
  - React 19.2.6
  - TypeScript 6.0.3
  - Vite 8.0.16
  - Fluent UI React Components v9.74.1
  - PNPM 11.15.0
  - Oxlint (Rust linter, no ESLint)
  - Biome (Rust formatter, no Prettier)
  - Custom filename linter (scripts/check-filenames.mjs)
  - Husky + lint-staged + commitlint (git hooks)
  - Docker + Docker Compose (multi-stage)
  - Nginx Alpine (production)
  - Dependabot (GitHub, .github/dependabot.yml)

carpetas_relevantes:
  - src/ # Main source code
  - src/components/ # React components (14 subdirectories)
  - src/services/ # Business logic (FreeCurrency.ts, LocalStorage.ts)
  - src/styles/ # Global styles (main.css)
  - src/config/ # Config contract tests (nginx, dockerfile, dependabot, ...)
  - docs/ # Project documentation
  - assets/ # Static resources
  - skills/ # Documented skills for agents (fluent-ui-react, modern-linting)
  - .github/ # GitHub automation (Dependabot)
  - .husky/ # Git hooks

carpetas_omitidas:
  - node_modules
  - dist
  - .git
  - .husky

archivos_relevantes:
  - LICENSE.md # CC BY 4.0 license summary
  - THIRD-PARTY-LICENSES.md # Fonts (OFL) + runtime deps (MIT) licenses
  - favicon.svg # Neon "EX" monogram favicon (source)
  - .github/dependabot.yml # Dependabot config (npm/pnpm v9, weekly, 3 ignore rules)

entrypoints:
  - index.html # Root HTML with favicons and mount point
  - src/main.tsx # Main React application entry point

commands:
  dev: pnpm dev
  build: pnpm build
  test: pnpm vitest run
  test:watch: pnpm vitest
  test:coverage: pnpm vitest run --coverage
  test:e2e: pnpm playwright test

env_keys:
  - NODE_ENV
  - VITE_API_URL
  - VITE_DEBUG
  - VITE_HMR
  - CHOKIDAR_USEPOLLING
  - WATCHPACK_POLLING
  - FAST_REFRESH
  - VITE_LOG_LEVEL

services:
  - Docker
  - Docker Compose
  - Nginx

politicas: "Mandatory use of .ia/AGENTS.md"

skills_registry:
  ubicacion: skills/
  skills:
    - nombre: fluent-ui-react
      ruta: skills/fluent-ui-react/SKILL.md
      lineas: 229
      descripcion: >
        Implementation patterns for React 19 and Fluent UI React Components v9.
        Covers FluentProvider, makeStyles (Griffel), BrandVariants, mergeClasses,
        and prohibitive rules (no Tailwind, no inline styles, no Fluent v8).
      estado: activo

    - nombre: modern-linting
      ruta: skills/modern-linting/SKILL.md
      lineas: 204
      descripcion: >
        Usage guide for Oxlint (linter), Biome (formatter), and the custom
        filename checker (scripts/check-filenames.mjs, replacing ls-lint).
        as the project's exclusive toolchain. Prohibits ESLint and Prettier.
        Includes commands, configurations, and edge case lessons.
      estado: activo
