server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ocultar la firma y versión de Nginx por seguridad
    server_tokens off;

    # Política de seguridad centralizada (vía HTTP header — única fuente de verdad)
    set $csp_header "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.freecurrencyapi.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'";

    # Compresión gzip robusta para mejorar rendimiento de transferencia
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Bloquear silenciosamente el acceso a cualquier archivo o carpeta oculto
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
        log_not_found off;
        access_log off;
    }

    # Cache de larga duración para assets estáticos inmutables
    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Security-Policy $csp_header always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Enrutamiento de Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;

        # Evitar cacheo del index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate, no-transform" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy $csp_header always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Redirigir errores 404 a la SPA
    error_page 404 =200 /index.html;
}
