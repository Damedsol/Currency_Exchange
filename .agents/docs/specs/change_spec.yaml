# change_spec — currencyExchange
# SDD equivalent of openspec/changes/<change>/proposal.md
change: security-advisories-and-dependency-refresh
status: active
archived_requirements: [R1, R2, R3, R5]   # merged into .agents/docs/specs/security.md (SEC-09..SEC-12) on 2026-09-17
pending_requirements: [R4, R6, R7]         # Cycles B (T6-T7) and C (T8-T10) — keep this change active
created: 2026-09-17
plan: .agents/docs/plan_2026-09-17_security-advisories-deps.md
analysis: .agents/docs/analysis_2026-09-17_security-advisories.md
domain: .agents/docs/specs/security.md
approval_required:
  - "pnpm install / dependency updates (AGENTS.md)"
  - "infra change: .github/workflows/ci.yml (AGENTS.md)"
  - "destructive: .deepsec/ removal (E1)"

requirements:
  - id: R1
    title: Authoritative SCA evidence before and after any dependency change
    acceptance: >
      `pnpm audit --audit-level=low` and `pnpm outdated` executed in an auditing gate;
      results recorded in `.agents/docs/security_report.md`; audit reports 0 advisories
      at the end of the cycle.
    tasks: [T1, T5, T10]
  - id: R2
    title: No security override can silently jump a major
    acceptance: >
      Every entry of pnpm-workspace.yaml:overrides is bounded to its intended major
      (`^X.Y.Z` or `>=X.Y.Z <X+1.0.0`), except pins explicitly documented as intentional.
    tasks: [T2, T3]
  - id: R3
    title: Security overrides bounded to their major and to the advisory fix floors
    acceptance: >
      Every override range (a) stays inside its intended major and (b) has a floor at or above the
      known advisory fix version: js-yaml ^4.3.2 (GHSA-2883-xcg3-v3hh, GHSA-52cp-r559-cp3m,
      GHSA-5p4m-2wfm-xmqj, GHSA-h67p-54hq-rp68), picomatch ^4.0.4 (GHSA-3v7f-55p6-f55p),
      yaml ^2.8.3 (GHSA-48c2-rrv3-qjmp), fast-uri >=4.1.3 <5.0.0, postcss >=8.5.18 <9.0.0,
      nanoid ^3.3.18, undici ^7.29.0; @fluentui/react-motion 9.15.0 stays the only documented
      pin (jsdom compat). Patch freshness ABOVE the floor is deferred to an approved `pnpm up`:
      preferFrozenLockfile keeps existing resolutions and minimumReleaseAge 7200 can defer the
      newest patch, so a range must never demand a version newer than the resolved one.
    tasks: [T2, T3]
  - id: R4
    title: Direct dependencies refreshed inside their current major
    acceptance: >
      Catalog ranges updated for @fluentui/react-components, @fluentui/react-icons,
      react, react-dom, vite, @vitejs/plugin-react, playwright, @playwright/test,
      @biomejs/biome, oxlint, @testing-library/react, @testing-library/user-event;
      vitest, typescript, jsdom, @testing-library/jest-dom, lint-staged, @commitlint/*,
      @types/node, pnpm stay on their majors.
    tasks: [T6, T7]
  - id: R5
    title: Dependabot rules minimal and documented
    acceptance: >
      Each `ignore` entry carries the incompatibility that justifies it; patch/minor
      updates are grouped; undici/nanoid rules exist only while jsdom 29 / postcss 8.5 need them.
    tasks: [T4]
  - id: R6
    title: CI validates pull requests
    acceptance: >
      .github/workflows/ci.yml runs Node 24 + pnpm 11, `pnpm install --frozen-lockfile`,
      `pnpm audit --audit-level=high`, `pnpm typecheck`, `pnpm lint`, `pnpm test` on pull_request.
    tasks: [T8]
  - id: R7
    title: No unaudited local dependency tree
    acceptance: >
      `.deepsec/` removed from disk or explicitly audited and documented; audit report
      present at `.agents/docs/security_report.md`.
    tasks: [T9, T10]

out_of_scope:
  - vitest 5 / @vitest/coverage-v8 5
  - typescript 7
  - jsdom 30 (+ undici 8 / nanoid 4 migration, @fluentui/react-motion >= 9.16)
  - "@testing-library/jest-dom 7, lint-staged 17, @commitlint/cli 21, @types/node 26, pnpm 12"
  - src/services/* and any business logic (last cycle green: 334 unit tests)

edges:
  - pnpm-lock.yaml is regenerated by pnpm install (mechanical; excluded from the workload count)
  - minimumReleaseAge 7200 (5 days) may defer undici 7.29.1; never bypassed with --force
  - preferFrozenLockfile + engineStrict: install must be an explicit, approved action
  - hoistPattern "*": an override change rewrites node_modules links -> full suite required
  - advisory source of truth is OSV/GitHub Advisory DB (Dependabot), broader than `pnpm audit`: use
    `.agents/.state/scan-advisories.mjs` for a full-lockfile sweep (385 packages, GET/POST only)
