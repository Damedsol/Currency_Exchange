services:
  frontend:
    container_name: currency-exchange-frontend
    build:
      context: .
      target: ${DOCKER_TARGET:-development}
    ports:
      - "${PORT:-5173}:${INTERNAL_PORT:-5173}"
    volumes:
      # Estos volúmenes se aplican en desarrollo local para hot-reloading
      - ./src:/app/src:delegated
      - ./public:/app/public:delegated
      - node_modules:/app/node_modules
      - vite_cache:/app/node_modules/.vite:rw
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    env_file:
      - .env.${NODE_ENV:-development}
    restart: unless-stopped
    networks:
      - currency-exchange-network

networks:
  currency-exchange-network:
    driver: bridge

volumes:
  node_modules:
    driver: local
  vite_cache:
    driver: local
