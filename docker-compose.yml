version: '3.8'

services:
  dev:
    container_name: currency-exchange-dev
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src
      # Mount public directory if needed
      - ./public:/app/public
      # Use a named volume for node_modules to avoid overriding container's node_modules
      - node_modules:/app/node_modules
    # Environment variable alternative to vite.config.js watch polling:
    # environment:
    #   - CHOKIDAR_USEPOLLING=true

  prod:
    container_name: currency-exchange-prod
    build:
      context: .
      target: prod
    ports:
      - "8080:80"

volumes:
  node_modules: # Define the named volume 
