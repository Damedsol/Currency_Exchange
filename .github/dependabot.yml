version: 2
updates:
  - package-ecosystem: "npm" # pnpm lockfile v9
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # R5: collapse minor/patch updates into a single PR so majors stay reviewable
    # one by one (majors are the ones that break: vitest 5, jsdom 30, TS 7).
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # undici 8.x breaks jsdom@29.1.1 (wrap-handler.js removed)
      - dependency-name: "undici"
        versions: [">=8.0.0"]
      # postcss@8.5.x requires nanoid ^3.3.16
      - dependency-name: "nanoid"
        versions: [">=4.0.0"]
      # Pinned to 9.15.0 for jsdom compatibility (pnpm-workspace.yaml)
      - dependency-name: "@fluentui/react-motion"
        versions: [">=9.16.0"]