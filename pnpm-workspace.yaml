packages:
  - "."
resolutionMode: highest
strictPeerDependencies: true
preferFrozenLockfile: true
hoist: true
shamefullyHoist: false
hoistPattern:
  - "*"
publicHoistPattern:
  - "@types/*"
engineStrict: true
verifyStoreIntegrity: true
blockExoticSubdeps: true
allowBuilds:
  esbuild: true
  unrs-resolver: true
registries:
  default: https://registry.npmjs.org/
minimumReleaseAge: 7200
catalog:
  "@biomejs/biome": "^2.4.0"
  "@fluentui/react-components": "^9.74.0"
  "@fluentui/react-icons": "^2.0.328"
  react: "^19.2.0"
  react-dom: "^19.2.0"
  "@commitlint/cli": "^20.5.0"
  "@commitlint/config-conventional": "^20.0.0"
  "@types/node": "^24.0.0"
  "@types/react": "^19.2.0"
  "@types/react-dom": "^19.2.0"
  "@vitejs/plugin-react": "^6.0.0"
  husky: "^9.1.0"
  lint-staged: "^16.4.0"
  oxlint: "^1.66.0"
  typescript: "^6.0.0"
  vite: "^8.0.16"
  vitest: "^4.1.11"
  "@vitest/coverage-v8": "^4.1.11"
  "@testing-library/react": "^16.3.0"
  "@testing-library/jest-dom": "^6.9.0"
  "@testing-library/user-event": "^14.6.0"
  jsdom: "^29.1.0"
  playwright: "^1.63.0"
  "@playwright/test": "^1.60.0"

"overrides":
  "js-yaml": ">=4.3.0"
  "picomatch": "4.0.4"
  "yaml": "2.8.3"
  "fast-uri": ">=4.1.3"
  "postcss": ">=8.5.18"
  "nanoid": "^3.3.18"
  "@fluentui/react-motion": "9.15.0"
  "undici": "^7.29.0"
