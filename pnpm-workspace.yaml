packages:
  - "."
resolutionMode: highest
strictPeerDependencies: true
preferFrozenLockfile: true
hoist: true
shamefullyHoist: false
hoistPattern:
  - "*"
publicHoistPattern:
  - "@types/*"
engineStrict: true
verifyStoreIntegrity: true
blockExoticSubdeps: true
allowBuilds:
  esbuild: true
  unrs-resolver: true
registries:
  default: https://registry.npmjs.org/
minimumReleaseAge: 7200
catalog:
  "@biomejs/biome": "^2.5.13"
  "@fluentui/react-components": "^9.74.7"
  "@fluentui/react-icons": "^2.0.341"
  react: "^19.3.0"
  react-dom: "^19.2.0"
  "@commitlint/cli": "^20.5.0"
  "@commitlint/config-conventional": "^20.0.0"
  "@types/node": "^24.0.0"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.2.0"
  "@vitejs/plugin-react": "^6.1.1"
  husky: "^9.1.0"
  lint-staged: "^16.4.0"
  oxlint: "^1.66.0"
  typescript: "^6.0.0"
  vite: "^8.3.0"
  vitest: "^4.1.11"
  "@vitest/coverage-v8": "^4.1.11"
  "@testing-library/react": "^16.3.3"
  "@testing-library/jest-dom": "^6.9.0"
  "@testing-library/user-event": "^14.6.7"
  jsdom: "^29.1.0"
  playwright: "^1.63.0"
  "@playwright/test": "^1.63.0"

"overrides":
  # Security/compat overrides. Rule: every range stays bounded to the major it was
  # chosen for. A bare `>=X.Y.Z` with resolutionMode: highest can jump a major
  # (js-yaml 4.x -> 5.x happened with the 2026-08 override).
  "fast-uri": ">=4.1.3 <5.0.0"          # 4.x: GHSA-5jgf/f65p/fph4/jqff fixed in >=4.1.3
  "js-yaml": "^4.3.2"                 # 4.x: @commitlint API + GHSA-2883/52cp/5p4m/h67p fixed in 4.3.2
  "nanoid": "^3.3.18"                  # 3.x: postcss 8.5.x requires ^3.3.16
  "picomatch": "^4.0.4"                # 4.x: security floor (was an exact pin)
  "postcss": ">=8.5.18 <9.0.0"         # 8.x: security floor
  "undici": "^7.29.0"                  # 7.x: jsdom 29 declares ^7.25 (8.x removed wrap-handler.js)
  "yaml": "^2.8.3"                     # 2.x: security floor (was an exact pin)
  "@fluentui/react-motion": "9.15.0"   # pin: jsdom 29 compat (Dependabot ignores >=9.16.0)
